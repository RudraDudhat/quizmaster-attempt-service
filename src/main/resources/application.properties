server.port = 8083

# # ===========================
# # Database
# # ===========================
spring.datasource.url: ${DB_URL:jdbc:postgresql://localhost:5432/quiz_attempt_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# # ===========================
# # JPA / Hibernate
# # ===========================
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}


# # ===========================
# # Eureka config
# # ===========================
eureka.client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.application.name=quizmaster-attempt-service

# # ===========================
# # Kafka
# # ===========================
# Master switch — set KAFKA_ENABLED=false (env) to run without a broker:
# submit won't hand off for grading and the graded-event listener won't start.
app.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}

# Consumer — attempt-service consumes only quiz.attempt.graded (AttemptGradedEvent)
spring.kafka.consumer.group-id=attempt-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.quizmaster.attempt.event.AttemptGradedEvent

# Producer — attempt-service publishes quiz.attempt.submitted (GradingJob)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# # ===========================
# # Attempt / anti-cheat
# # ===========================
# Max tab switches before an attempt is flagged suspicious.
# TODO: move to a settings-service once it exists.
app.attempt.max-tab-switches=${MAX_TAB_SWITCHES:5}
